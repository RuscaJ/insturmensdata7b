<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Instrumentos - 7B (Rusca)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-5xl mx-auto">
        <header class="mb-8 border-b border-slate-700 pb-4">
            <h1 class="text-3xl font-bold text-sky-400">Registro de Instrumentos (InsturmensData_7B)</h1>
            <p class="text-slate-400 text-sm mt-1">CRUD conectado a Base de Datos de Vercel - Rusca</p>
        </header>

        <!-- Formulario de Carga / Edición -->
        <form id="formInstrumento" class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 mb-8 grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="hidden" id="inst_id">
            
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">8.1 Nombre de la persona que carga el dato</label>
                <input type="text" id="persona" required placeholder="Ej: Juan Rusca" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-sky-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">8.2 Nombre del instrumento</label>
                <input type="text" id="instrumento" required placeholder="Ej: Altímetro / Garmin G5" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-sky-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">8.3 Número de Parte (P/N)</label>
                <input type="text" id="nro_parte" required placeholder="Ej: 010-01485-00" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-sky-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">8.4 Número de Serie (S/N)</label>
                <input type="text" id="nro_serie" required placeholder="Ej: SN-498210" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-sky-500 focus:outline-none">
            </div>

            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-slate-300 mb-1">8.5 Foto del instrumento</label>
                <input type="file" id="fotoInput" accept="image/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-sky-600 file:text-white hover:file:bg-sky-500">
            </div>

            <div class="md:col-span-2 flex gap-3 mt-2">
                <button type="submit" id="btnGuardar" class="bg-sky-500 hover:bg-sky-600 text-white font-semibold px-6 py-2 rounded-lg transition">Guardar Instrumento</button>
                <button type="button" id="btnCancelar" onclick="resetForm()" class="hidden bg-slate-600 hover:bg-slate-500 text-white px-4 py-2 rounded-lg transition">Cancelar Edición</button>
            </div>
        </form>

        <!-- Tabla de Registros -->
        <div class="bg-slate-800 rounded-xl shadow-lg border border-slate-700 overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-950/60 text-slate-300 text-sm uppercase">
                        <th class="p-4">Foto</th>
                        <th class="p-4">Cargado por</th>
                        <th class="p-4">Instrumento</th>
                        <th class="p-4">Nro. de Parte</th>
                        <th class="p-4">Nro. de Serie</th>
                        <th class="p-4 text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaInstrumentos" class="divide-y divide-slate-700 text-sm">
                    <tr><td colspan="6" class="p-6 text-center text-slate-400">Cargando datos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let fotoBase64 = '';

        // Comprimir y convertir foto a Base64 para guardarla directo en la BD de Vercel
        document.getElementById('fotoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const max_size = 300;
                    let width = img.width, height = img.height;
                    if (width > height && width > max_size) { height *= max_size / width; width = max_size; }
                    else if (height > max_size) { width *= max_size / height; height = max_size; }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    fotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        async function cargarInstrumentos() {
            try {
                const res = await fetch('/api/instrumentos');
                const data = await res.json();
                const tbody = document.getElementById('tablaInstrumentos');
                
                if (!res.ok) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-amber-400">Atención: Asegurate de haber conectado Vercel Postgres en la pestaña Storage de Vercel (${data.error || 'Sin conexión a BD'}).</td></tr>`;
                    return;
                }

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-slate-400">No hay instrumentos cargados todavía.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(item => `
                    <tr class="hover:bg-slate-700/40">
                        <td class="p-4">
                            ${item.foto ? `<img src="${item.foto}" class="w-16 h-16 object-cover rounded-lg border border-slate-600">` : '<span class="text-slate-500 text-xs">Sin foto</span>'}
                        </td>
                        <td class="p-4 font-medium">${item.persona}</td>
                        <td class="p-4 text-sky-300 font-semibold">${item.instrumento}</td>
                        <td class="p-4 font-mono text-xs">${item.nro_parte}</td>
                        <td class="p-4 font-mono text-xs">${item.nro_serie}</td>
                        <td class="p-4 text-center space-x-2">
                            <button onclick='editar(${JSON.stringify(item).replace(/'/g, "&#39;")})' class="bg-amber-500/20 text-amber-300 hover:bg-amber-500/30 px-3 py-1 rounded">Editar</button>
                            <button onclick="eliminar(${item.id})" class="bg-red-500/20 text-red-300 hover:bg-red-500/30 px-3 py-1 rounded">Eliminar</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('formInstrumento').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('inst_id').value;
            const payload = {
                id,
                persona: document.getElementById('persona').value,
                instrumento: document.getElementById('instrumento').value,
                nro_parte: document.getElementById('nro_parte').value,
                nro_serie: document.getElementById('nro_serie').value,
                foto: fotoBase64
            };

            const btn = document.getElementById('btnGuardar');
            btn.disabled = true;
            btn.textContent = 'Guardando...';

            await fetch('/api/instrumentos', {
                method: id ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            resetForm();
            await cargarInstrumentos();
            btn.disabled = false;
        });

        function editar(item) {
            document.getElementById('inst_id').value = item.id;
            document.getElementById('persona').value = item.persona;
            document.getElementById('instrumento').value = item.instrumento;
            document.getElementById('nro_parte').value = item.nro_parte;
            document.getElementById('nro_serie').value = item.nro_serie;
            fotoBase64 = '';
            document.getElementById('btnGuardar').textContent = 'Actualizar Instrumento';
            document.getElementById('btnCancelar').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function eliminar(id) {
            if (!confirm('¿Seguro que querés eliminar este instrumento?')) return;
            await fetch(`/api/instrumentos?id=${id}`, { method: 'DELETE' });
            cargarInstrumentos();
        }

        function resetForm() {
            document.getElementById('formInstrumento').reset();
            document.getElementById('inst_id').value = '';
            fotoBase64 = '';
            document.getElementById('btnGuardar').textContent = 'Guardar Instrumento';
            document.getElementById('btnCancelar').classList.add('hidden');
        }

        cargarInstrumentos();
    </script>
</body>
</html>
